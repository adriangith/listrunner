name: Nightly TestFlight beta

on:
  schedule:
    # 02:07 Melbourne is 15:07 UTC during AEDT, 16:07 during AEST.
    # The script checks the local hour; only one slot can start a build.
    - cron: '7 15,16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Plan is read-only. Run starts/reconciles the daily beta.'
        type: choice
        options: [plan, run]
        default: plan

permissions:
  contents: write

concurrency:
  group: listrunner-nightly-beta
  cancel-in-progress: false

jobs:
  beta:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check automation offline
        run: node --test packages/ios/tests/nightly-beta.test.mjs
      - name: Plan or release nightly beta
        env:
          GH_TOKEN: ${{ github.token }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          BETA_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'run' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node packages/ios/tools/nightly-beta.mjs "$BETA_MODE"
