<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f5f7" />
    <title>ListRunner · Interactive Prototype</title>
    <link rel="stylesheet" href="./prototype.css" />
  </head>
  <body>
    <main class="stage">
      <aside class="intro">
        <div class="brand-mark">LR</div>
        <p class="eyebrow">INTERACTIVE PROTOTYPE</p>
        <h1>One list.<br />One item at a time.</h1>
        <p class="intro-copy">Try the ListRunner shopping flow. Add or paste items, open the simulated Coles store, and step through your list.</p>
        <div class="prototype-note"><span class="note-dot"></span><span>Coles is simulated. No products are added to a real cart.</span></div>
        <div class="flow-steps"><span>01 <b>Build a list</b></span><i></i><span>02 <b>Shop in Coles</b></span><i></i><span>03 <b>Finish the run</b></span></div>
      </aside>

      <section class="device" aria-label="ListRunner iPhone prototype">
        <div class="island" aria-hidden="true"></div>
        <div class="status-bar"><span id="clock">9:41</span><span class="status-icons" aria-label="Mobile signal, Wi-Fi, battery"><svg viewBox="0 0 48 16" aria-hidden="true"><path d="M1 12h3V8H1zm6 0h3V5H7zm6 0h3V2h-3zM23 5.2c4.8 0 8.7 1.8 11.5 4.9l-1.8 1.8c-2.3-2.6-5.6-4-9.7-4s-7.4 1.4-9.7 4l-1.8-1.8C15.3 7 19.2 5.2 24 5.2zm0 4.2c2.9 0 5.4 1.1 7.1 3l-7.1 3.4-7.1-3.4c1.7-1.9 4.2-3 7.1-3zM38 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v8h8V4zM48 6v4h1a1 1 0 0 0 0-2h-1z" fill="currentColor"/></svg></span></div>
        <div id="app" class="app"></div>
        <div class="home-indicator" aria-hidden="true"><span></span></div>
      </section>
    </main>
    <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./prototype.js"></script>
  </body>
</html>
